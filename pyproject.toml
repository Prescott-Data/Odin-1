[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odin-engine"
version = "0.3.0"
description = "Odin: Graph intelligence engine with PPR + NPLL for AI agent navigation"
authors = [{name = "Prescott Data"}]
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["knowledge-graph", "graph-intelligence", "pagerank", "neural-logic", "ai-agents", "graph-exploration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
dependencies = [
  "torch>=2.0.0",
  "python-arango>=7.0",
  "numpy>=1.20.0",
  "networkx>=3.0",
  "scipy>=1.10.0",
  "scikit-learn>=1.3.0",
  "gremlinpython>=3.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov",
  "flake8",
  "bandit",
  "psutil",
]

[project.scripts]
odin = "odin.cli:main"

[tool.setuptools.packages.find]
include = ["odin*", "npll*", "retrieval*", "benchmarks*"]
exclude = ["tests*", "whitepaper*", "docs*"]

[tool.setuptools.package-data]
odin = ["skills/**/*.md"]

[project.urls]
Homepage = "https://odin.developers.prescottdata.io"
Documentation = "https://odin.developers.prescottdata.io"
Repository = "https://github.com/Prescott-Data/Odin-1"
Issues = "https://github.com/Prescott-Data/Odin-1/issues"
Changelog = "https://github.com/Prescott-Data/Odin-1/blob/main/CHANGELOG.md"