name: Bug report
description: Report reproducible incorrect behavior in Odin
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Odin. Do not report security vulnerabilities here; use the repository Security tab.
  - type: input
    id: version
    attributes:
      label: Odin version
      description: Run `python -c "import odin; print(odin.__version__)"`.
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: 3.12.4
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Graph backend
      options:
        - ArangoDB
        - JanusGraph
        - Custom adapter
        - In-memory test graph
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest code sample, graph shape, and parameters that reproduce the issue. Remove credentials and sensitive data.
      render: python
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Include complete relevant errors or traces after removing credentials and sensitive data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials, private graph data, and personal information.
          required: true